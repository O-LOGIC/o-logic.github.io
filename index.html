<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O-Logic Portal</title>
    <style>
        :root {
            --primary-bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --accent: #1DB954; /* Updated to a Spotify-like green for SpotiData context */
            --hover-accent: #1aa34a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: var(--text-main);
        }

        .header p {
            font-size: 1.1rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .card-container {
            display: flex;
            justify-content: center;
            width: 90%;
            max-width: 400px;
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #e1e4e8;
            width: 100%;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border-color: var(--accent);
        }

        .card h2 {
            font-size: 1.75rem;
            margin: 0 0 1rem 0;
            color: var(--accent);
        }

        .card p {
            font-size: 1rem;
            color: #555;
            margin: 0;
            line-height: 1.4;
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>O-Logic</h1>
        <p>Central Access Portal</p>
    </div>

    <div class="card-container">
        <!-- Direct link to spotidata.html -->
        <a href="spotidata.html" class="card">
            <h2>SpotiData</h2>
            <p>Access your music data and analytics.</p>
        </a>
    </div>

    <div class="footer">
        &copy; 2026 O-Logic Systems. All rights reserved.
    </div>

</body>
</html>
