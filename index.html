<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O-Logic Portal</title>
    <style>
        :root {
            --primary-bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --accent-green: #1DB954;
            --accent-blue: #2eaadc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 3rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: var(--text-main);
        }

        .header p {
            font-size: 1.1rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 2rem;
            width: 90%;
            max-width: 700px;
        }

        .card {
            background: var(--card-bg);
            padding: 2.5rem 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #e1e4e8;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
        }

        /* Specific card hover colors */
        .card.spotify:hover { border-color: var(--accent-green); }
        .card.wiki:hover { border-color: var(--accent-blue); }

        .card h2 {
            font-size: 1.75rem;
            margin: 0 0 1rem 0;
        }

        .card.spotify h2 { color: var(--accent-green); }
        .card.wiki h2 { color: var(--accent-blue); }

        .card p {
            font-size: 1rem;
            color: #555;
            margin: 0;
            line-height: 1.4;
        }

        .footer {
            margin-top: 4rem;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>O-Logic</h1>
        <p>Central Access Portal</p>
    </div>

    <div class="grid-container">
        <!-- SpotiData Link -->
        <a href="spotidata.html" class="card spotify">
            <h2>SpotiData</h2>
            <p>Access your music data and analytics.</p>
        </a>

        <!-- Wiki Link -->
        <a href="wiki/index.html" class="card wiki">
            <h2>O-Logic Wiki</h2>
            <p>Access the central knowledge base and documentation.</p>
        </a>
    </div>

    <div class="footer">
        &copy; 2026 O-Logic Systems. All rights reserved.
    </div>

</body>
</html>
