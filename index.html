<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O-Logic Portal</title>
    <style>
        :root {
            --primary-bg: #f4f7f6;
            --card-bg: #ffffff;
            --text-main: #333333;
            --accent: #007acc;
            --hover-accent: #005f9e;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .header h1 {
            font-size: 2.5rem;
            margin: 0;
            color: var(--accent);
        }

        .header p {
            font-size: 1.1rem;
            color: #666;
            margin-top: 0.5rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
            width: 90%;
            max-width: 900px;
        }

        .card {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            text-align: center;
            text-decoration: none;
            color: var(--text-main);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            border: 1px solid #e1e4e8;
        }

        .card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.1);
            border-color: var(--accent);
        }

        .card h2 {
            font-size: 1.5rem;
            margin: 0 0 1rem 0;
        }

        .card p {
            font-size: 0.95rem;
            color: #555;
            margin: 0;
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>O-Logic</h1>
        <p>Central Access Portal</p>
    </div>

    <div class="grid-container">
        <!-- Update the href attributes with your actual links -->
        <a href="#projects" class="card">
            <h2>Projects</h2>
            <p>View current repositories and active builds.</p>
        </a>
        
        <a href="#docs" class="card">
            <h2>Documentation</h2>
            <p>Access technical guides and system architecture.</p>
        </a>
        
        <a href="#dashboard" class="card">
            <h2>Dashboard</h2>
            <p>Monitor system status and analytics.</p>
        </a>

        <a href="#contact" class="card">
            <h2>Contact</h2>
            <p>Reach out to the administration team.</p>
        </a>
    </div>

    <div class="footer">
        &copy; 2026 O-Logic Systems. All rights reserved.
    </div>

</body>
</html>
