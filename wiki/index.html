<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O-Logic Wiki</title>
    <style>
        :root {
            --bg-color: #ffffff;
            --sidebar-bg: #f7f7f5;
            --text-main: #37352f;
            --text-muted: #9a9a97;
            --border-color: #e9e9e7;
            --accent: #2eaadc;
            --accent-hover: #1b8ebc;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            color: var(--text-main);
            background-color: var(--bg-color);
        }

        /* Sidebar Styles */
        .sidebar {
            width: 250px;
            background-color: var(--sidebar-bg);
            border-right: 1px solid var(--border-color);
            padding: 1rem 0;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 0 1rem 1rem 1rem;
            font-weight: 600;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 1rem;
        }

        .nav-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .nav-item {
            padding: 0.5rem 1rem;
            cursor: pointer;
            font-size: 0.95rem;
            transition: background 0.1s ease;
        }

        .nav-item:hover {
            background-color: rgba(0, 0, 0, 0.05);
        }

        .nav-item.active {
            background-color: rgba(0, 0, 0, 0.08);
            font-weight: 500;
        }

        /* Main Content Styles */
        .main-content {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .toolbar {
            padding: 1rem 2rem;
            display: flex;
            justify-content: flex-end;
            border-bottom: 1px solid transparent;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(5px);
        }

        button {
            background-color: transparent;
            border: 1px solid var(--border-color);
            padding: 0.4rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-main);
            transition: all 0.2s ease;
            margin-left: 0.5rem;
        }

        button:hover {
            background-color: var(--sidebar-bg);
        }

        button.primary {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        button.primary:hover {
            background-color: var(--accent-hover);
        }

        .editor-container {
            padding: 2rem 10%;
            max-width: 800px;
            margin: 0 auto;
            width: 100%;
        }

        .editor {
            outline: none;
            min-height: 50vh;
            line-height: 1.6;
        }

        .editor[contenteditable="true"] {
            padding: 1rem;
            border: 1px dashed var(--border-color);
            border-radius: 8px;
            background-color: #fafafa;
        }

        .editor h1 {
            font-size: 2.5rem;
            margin-top: 0;
        }

        .editor h2 {
            font-size: 1.5rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 0.3rem;
        }

        .status {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-right: auto;
            align-self: center;
        }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">O-Logic Wiki</div>
        <ul class="nav-list" id="navList">
            <li class="nav-item active" data-page="home">Home</li>
            <li class="nav-item" data-page="spotidata">SpotiData Integration</li>
            <li class="nav-item" data-page="architecture">Architecture</li>
        </ul>
    </div>

    <div class="main-content">
        <div class="toolbar">
            <div class="status" id="statusText">Reading mode</div>
            <button id="editBtn">Edit Page</button>
            <button id="saveBtn" class="primary" style="display: none;">Save Changes</button>
        </div>
        
        <div class="editor-container">
            <div id="editor" class="editor" contenteditable="false">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <script>
        // Default wiki content if no local saves exist
        const defaultPages = {
            home: `<h1>Welcome to the O-Logic Wiki</h1><p>This is your central knowledge base. Click "Edit Page" in the top right to start modifying this text.</p><ul><li>Use standard text</li><li>Create lists</li><li>Add links</li></ul>`,
            spotidata: `<h1>SpotiData Integration</h1><p>Documentation for the Spotify data pipeline and analytics dashboard.</p><h2>Endpoints</h2><p>Data is routed through the main API gateway.</p>`,
            architecture: `<h1>System Architecture</h1><p>Overview of the current repository structure and deployment pipelines.</p>`
        };

        let currentPage = 'home';
        const editor = document.getElementById('editor');
        const editBtn = document.getElementById('editBtn');
        const saveBtn = document.getElementById('saveBtn');
        const statusText = document.getElementById('statusText');
        const navItems = document.querySelectorAll('.nav-item');

        // Load page content from localStorage or defaults
        function loadPage(pageId) {
            currentPage = pageId;
            const savedContent = localStorage.getItem(`wiki_${pageId}`);
            editor.innerHTML = savedContent ? savedContent : defaultPages[pageId];
            
            // Update active state in sidebar
            navItems.forEach(item => {
                item.classList.toggle('active', item.dataset.page === pageId);
            });
            
            setEditMode(false);
        }

        // Toggle edit state
        function setEditMode(isEditing) {
            editor.setAttribute('contenteditable', isEditing);
            if (isEditing) {
                editBtn.style.display = 'none';
                saveBtn.style.display = 'block';
                statusText.innerText = 'Editing... (HTML formatting supported)';
                editor.focus();
            } else {
                editBtn.style.display = 'block';
                saveBtn.style.display = 'none';
                statusText.innerText = 'Reading mode';
            }
        }

        // Save to localStorage
        saveBtn.addEventListener('click', () => {
            const newContent = editor.innerHTML;
            localStorage.setItem(`wiki_${currentPage}`, newContent);
            setEditMode(false);
            statusText.innerText = 'Changes saved locally!';
            setTimeout(() => { statusText.innerText = 'Reading mode'; }, 3000);
        });

        editBtn.addEventListener('click', () => setEditMode(true));

        // Handle navigation clicks
        navItems.forEach(item => {
            item.addEventListener('click', (e) => {
                loadPage(e.target.dataset.page);
            });
        });

        // Initialize first page
        loadPage(currentPage);
    </script>
</body>
</html>
